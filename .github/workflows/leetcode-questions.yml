name: Run LeetCode Questions Validation

on:
  push:
    branches: [main]
    paths:
      - 'leetcode-questions/**'
      - 'compose.yml'
      - '.dockerignore'
      - 'docker/leetcode-questions.Dockerfile'
      - 'docker/leetcode-questions-run-tests.sh'
  pull_request:
    branches: [main]
    paths:
      - 'leetcode-questions/**'
      - 'compose.yml'
      - '.dockerignore'
      - 'docker/leetcode-questions.Dockerfile'
      - 'docker/leetcode-questions-run-tests.sh'

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Validate LeetCode questions
        run: docker compose run --rm leetcode-questions
